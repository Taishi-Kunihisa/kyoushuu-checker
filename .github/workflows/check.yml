name: 教習所の空き確認

on:
  schedule:
    # UTCで指定。これは日本時間 6:07〜23:07 の毎時（GitHub側の混雑で数分〜十数分遅れることあり）
    - cron: "7 21-23,0-14 * * *"
  workflow_dispatch:

concurrency:
  group: kyoushuu-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 前回の結果を復元
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: slots-state-${{ github.run_id }}
          restore-keys: slots-state-

      - name: 空き確認
        env:
          FAVORITE_URL: ${{ secrets.FAVORITE_URL }}
          STUDENT_NO: ${{ secrets.STUDENT_NO }}
          PASSWORD: ${{ secrets.PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEEKS: ${{ vars.WEEKS }}
          WEEKDAYS: ${{ vars.WEEKDAYS }}
          PERIODS: ${{ vars.PERIODS }}
        run: python check_slots.py

      - name: 結果を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: slots-state-${{ github.run_id }}
